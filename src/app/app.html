<div class="himmel-hintergrund" [class.nacht]="!istTag()">
  <video
    [src]="videoUrl()"
    autoplay
    loop
    muted
    playsinline
    class="hintergrund-video"
  ></video>
  <div class="verdunkelung"></div>

  @if (kategorie() === 'sturm') {
    <div class="blitz"></div>
  }
</div>

<main>
  <h1>{{ title() }}</h1>

  <div class="suchleiste">
    <input
      type="text"
      placeholder="Stadt eingeben"
      (input)="onInput($event)"
    >
    <button (click)="suchen()">Search</button>
  </div>

  @if (wetter.isLoading()) {
    <p class="status">Lädt...</p>
  }

  @if (wetter.error()) {
    <p class="fehler">Stadt nicht gefunden.</p>
  }

  @if (wetter.value(); as daten) {
    <div class="wetter-karte">
      <img [src]="iconUrl()" alt="" class="wetter-icon" width="120" height="120">
      <h2>{{ daten.name }}</h2>
      <p class="temperatur">{{ daten.main.temp | number:'1.0-0' }}°</p>
      <p class="beschreibung">{{ daten.weather[0].description }}</p>
    </div>
  }
</main>
